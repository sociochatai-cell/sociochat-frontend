# Deploys SocioChat frontend to Firebase Hosting on push to sociochat-parallel-run-fe.
# Secrets needed in GitHub repo settings:
#   FIREBASE_SERVICE_ACCOUNT_SOCIOCHAT_AI — service account JSON for sociochat-ai Firebase project

name: Deploy SocioChat Frontend to Firebase

on:
  push:
    branches:
      - sociochat-parallel-run-fe

jobs:
  build_and_deploy:
    name: Build + Deploy to Firebase
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOCIOCHAT_AI }}
          channelId: live
          projectId: sociochat-ai
